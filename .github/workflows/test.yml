# Runs on every push: vet, format, and the suite with the race detector, on
# the oldest Go that go.mod allows and on the newest. A server handles its
# requests concurrently, so -race is the run that matters, and the shutdown
# tests serve on a real port. Package storage's S3 runs against a MinIO
# beside it: an S3 that isn't tug's own idea of one. Package letsencrypt
# gets its certificates from a Pebble, Let's Encrypt's own CA for tests,
# which checks its challenges as Let's Encrypt does. And the auth starter
# made with -postgres and -mysql runs its tests on a Postgres and a MySQL
# beside it, the versions the guide says it's tested on.
#
# Then the Inertia example end to end: its TypeScript types checked against
# the Go ones (tug gen writes them again, and they must not change), the
# frontend type-checked and built, served by its Go server, and driven in
# Chromium with Inertia's real client. That's what catches an Inertia
# release that changes the protocol.
#
# And the auth starter in each frontend, React, Vue and Svelte, made by tug
# new, served as it's deployed, and driven by one suite: the same steps, by
# the same labels, so the three stay one app.
#
# And the benchmarks' module, bench/: its tests, not its benchmarks.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # MinIO's own images are gone from Docker Hub; Bitnami's last is kept.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: tug
          MINIO_ROOT_PASSWORD: tug-secret-key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 2s --health-timeout 2s --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tug
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TUG_TEST_S3: http://tug:tug-secret-key@127.0.0.1:9000
      TUG_TEST_POSTGRES: postgres://postgres:secret@127.0.0.1:5432/postgres?sslmode=disable
      TUG_TEST_MYSQL: mysql://root:secret@127.0.0.1:3306/tug
      TUG_TEST_ACME: https://127.0.0.1:14000/dir
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # The CLI's tests make an app of each kind with tug new, npm packages
      # and all, and build its frontend; the auth starter's SQLite driver is
      # a big compile.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Pebble checks the challenges on this machine's ports 5001 and 5002,
      # as Let's Encrypt checks 443 and 80, at 127.0.0.1, where
      # pebble-challtestsrv's DNS finds every name: so it runs here, as a
      # service's 127.0.0.1 would be its own container.
      - name: pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          bin=$(go env GOPATH)/bin
          nohup "$bin/pebble-challtestsrv" -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" -doh "" > /tmp/challtestsrv.log 2>&1 &
          cd "$(go mod download -json github.com/letsencrypt/pebble/v2@v2.10.1 | jq -r .Dir)"
          PEBBLE_VA_NOSLEEP=1 PEBBLE_AUTHZREUSE=0 nohup "$bin/pebble" -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053 > /tmp/pebble.log 2>&1 &
          curl -ks --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null https://127.0.0.1:14000/dir
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race ./...

  # The benchmarks' module, bench/, a module of its own: that ServeMux and
  # tug answer the benchmarks' request alike, that tug's App and its
  # inertia package render the same page, and the load's reader of
  # responses.
  # The benchmarks themselves run by hand, on a machine with nothing else
  # running: a runner's numbers would be its neighbours' as much as its own.
  bench:
    name: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    name: e2e (examples/inertia)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/inertia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/inertia/package-lock.json
      - run: npm ci
      - name: the types are the Go ones
        run: go run ../../cmd/tug gen && git diff --exit-code resources/js/tug
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  starters:
    name: e2e (the starters)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cmd/tug/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/tug/e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # setup.ts makes an app of each frontend with tug new, and runs them.
      - run: npx playwright test
