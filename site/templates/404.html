{{define "main"}}
<main id="content" class="lost" tabindex="-1">
  <div class="wrap lost-in">
    <p class="eyebrow">404</p>
    <h1>{{t "There's no page here."}}</h1>
    <p class="lead">{{t "The guide may have moved it, or the link has a typo. Search for what you were after, or start from the guide's parts."}}</p>
    <div class="hero-actions">
      <button type="button" class="btn btn-primary" data-search-open>{{template "i-search"}}{{t "Search the guide"}}</button>
      <a class="btn btn-secondary" href="{{href "docs/"}}">{{t "The guide's parts"}}</a>
      <a class="btn btn-ghost" href="{{href ""}}">{{template "i-arrow-left"}}{{t "Home"}}</a>
    </div>
  </div>
</main>
{{end}}
