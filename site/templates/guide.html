{{define "main"}}
<div class="docs docs-wide">
  <aside class="sidebar">{{template "sidenav" .}}</aside>
  <main id="content" class="docs-main" tabindex="-1">
    <article class="doc">
      <header class="doc-head">
        <p class="eyebrow">{{t "Guide"}}</p>
        <h1{{if .Fallback}} lang="en"{{end}}>{{.Page.TitleHTML}}</h1>
      </header>
      {{template "notes" .}}
      <div class="prose"{{if .Fallback}} lang="en"{{end}}>{{.Page.Body}}</div>
      {{template "parts" .}}
      <div class="prose"{{if .Fallback}} lang="en"{{end}}>{{.Page.After}}</div>
      <footer class="doc-foot">
        {{template "source" .}}
        {{with .Next}}<nav class="pager" aria-label="{{t "Pages of the guide"}}">
          <a class="pager-link pager-next" href="{{href .Path}}" rel="next"><span class="pager-dir">{{t "Start"}}{{template "i-arrow"}}</span><span class="pager-title">{{.Title}}</span></a>
        </nav>{{end}}
      </footer>
    </article>
  </main>
</div>
{{end}}
